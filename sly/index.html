<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Secure Partner Node...</title>
    <!-- ROBOTS TAG: Proteksi mutlak dari indeks Google & Bing -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <!-- Menggunakan versi Tailwind CSS CDN script yang benar -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0c2340] flex flex-col items-center justify-center min-h-screen text-white font-sans px-4">

    <!-- Kontainer Animasi Visual Kelas Premium -->
    <div class="text-center space-y-6 max-w-sm w-full">
        <!-- Spinner Loading Animasi CSS Murni -->
        <div class="relative w-16 h-16 mx-auto mb-4">
            <div class="absolute inset-0 rounded-full border-4 border-purple-500/20"></div>
            <div class="absolute inset-0 rounded-full border-4 border-t-purple-500 animate-spin"></div>
        </div>
        <h1 class="text-xs uppercase font-black tracking-[0.3em] text-purple-300">Securing Connection</h1>
        <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider leading-relaxed">
            Redirecting to verified New York E-SIM partner gateway. Please wait...
        </p>
    </div>

    <!-- KOREKSI JAVASCRIPT LOGIC -->
    <script>
        window.addEventListener("DOMContentLoaded", function() {
            // GANTI DENGAN LINK AFILIASI ASLI ANDA DI SINI
            const realAffiliateUrl = "https://saily.com/";

            // Eksekusi pengalihan rute setelah tepat 1000 milidetik (1 detik)
            setTimeout(function() {
                window.location.replace(realAffiliateUrl);
            }, 1000);
        }); // <-- Penutupan fungsi DOMContentLoaded yang valid
    </script>
</body>
</html>
